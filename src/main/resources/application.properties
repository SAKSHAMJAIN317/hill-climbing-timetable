# SmartSched AI - Configuration
spring.application.name=SmartSched AI

# Default profile (h2 allows immediate out-of-the-box execution and testing; activate 'mysql' profile for MySQL 8)
spring.profiles.default=dev

# Server
server.port=${PORT:8080}

# JSON configuration
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# Logging
logging.level.com.smartsched=INFO
logging.level.org.springframework.web=INFO
